services:

  bot:
    image: quoth:latest
    build:
      context: .
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      data:
        condition: service_healthy
        restart: true
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
       - discord_token
       - postgres_password

  data:
    image: postgres:latest
    volumes:
      - ./data:/app/data
    environment:
      PGDATA: /app/data
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
       - postgres_password
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      interval: 5s
      timeout: 5s

secrets:
  discord_token:
    file: secrets/discord_token
  postgres_password:
    file: secrets/postgres_password
